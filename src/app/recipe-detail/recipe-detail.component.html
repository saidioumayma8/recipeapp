<div *ngIf="recipe" class="container">
  <h2>{{ recipe.strMeal }}</h2>
  <img [src]="recipe.strMealThumb" alt="{{ recipe.strMeal }}" class="img-fluid">
  <h4>Category: {{ recipe.strCategory }}</h4>
  <h5>Area: {{ recipe.strArea }}</h5>
  <p>{{ recipe.strInstructions }}</p>

  <h5>Ingredients:</h5>
  <ul>
    <li *ngFor="let ingredient of getIngredients()">{{ ingredient }}</li>
  </ul>
</div>
